{% extends "base.html" %}
{% block title %}Users · Taskboard{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">Team</p><h1>Users</h1></div></section>
<div class="table-wrap">
  <table>
    <thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead>
    <tbody>
      {% for user in users %}
      <tr><td class="strong">{{ user.name }}</td><td>{{ user.email }}</td><td>{{ user.created_at.strftime('%Y-%m-%d') }}</td></tr>
      {% else %}<tr><td colspan="3" class="empty">No users found. Run the seed script.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
