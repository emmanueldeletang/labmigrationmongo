{% extends "base.html" %}
{% block title %}New task · Taskboard{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">Task management</p><h1>Create a task</h1></div></section>
<form class="task-form" method="post">
  <label for="title">Title</label><input id="title" name="title" required maxlength="160">
  <label for="description">Description</label><textarea id="description" name="description" rows="5"></textarea>
  <div class="form-grid">
    <div><label for="project_id">Project</label><select id="project_id" name="project_id" required>{% for project in projects %}<option value="{{ project._id }}" {% if selected_project == project._id|string %}selected{% endif %}>{{ project.name }}</option>{% endfor %}</select></div>
    <div><label for="assigned_user_id">Assignee</label><select id="assigned_user_id" name="assigned_user_id" required>{% for user in users %}<option value="{{ user._id }}">{{ user.name }}</option>{% endfor %}</select></div>
    <div><label for="duration_days">Duration</label><select id="duration_days" name="duration_days">{% for day in range(1, 6) %}<option value="{{ day }}">{{ day }} day{% if day != 1 %}s{% endif %}</option>{% endfor %}</select></div>
    <div><label for="status">Status</label><select id="status" name="status">{% for status in statuses %}<option value="{{ status }}">{{ status | replace('_', ' ') }}</option>{% endfor %}</select></div>
  </div>
  <label for="dependencies">Dependency task IDs <span class="muted">comma-separated</span></label><input id="dependencies" name="dependencies">
  <label class="checkbox"><input type="checkbox" name="can_run_parallel"> Can run in parallel</label>
  <div class="form-actions"><a class="button" href="{{ url_for('projects_page') }}">Cancel</a><button class="button primary" type="submit">Create task</button></div>
</form>
{% endblock %}
