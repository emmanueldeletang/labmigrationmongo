<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Taskboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="{{ url_for('dashboard') }}">Taskboard</a>
    <nav aria-label="Primary navigation">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('projects_page') }}">Projects</a>
      <a href="{{ url_for('users_page') }}">Users</a>
      <a class="button primary" href="{{ url_for('create_task_page') }}">New task</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="notice {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
